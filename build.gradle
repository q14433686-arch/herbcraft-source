plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

allprojects {
    group = project.maven_group
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
        maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    }
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'java-library'

    base {
        archivesName = project.name == 'core' ? 'herbcraft' : "herbcraft-${project.name}"
    }

    version = project.name == 'cuisine' ? '1.1.3' : '1.1.4'

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    }

    if (project.name == 'core') {
        dependencies {
            compileOnly "maven.modrinth:jade:${rootProject.jade_version}"
            runtimeOnly "maven.modrinth:jade:${rootProject.jade_version}"
        }
    }

    if (project.name == 'alchemy' || project.name == 'cuisine') {
        dependencies { implementation project(':core') }
    }

    if (project.name == 'alchemy') {
        dependencies {
            compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
            compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"
            compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rootProject.rei_version}"
            compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rootProject.rei_version}"
            compileOnly "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
        }
    }

    // TEMPORARY 26.3 API probe (remove once the mixin targets are verified in CI).
    // Prints javap signatures of the members that herbcraft mixins inject into, so the
    // compile-check log shows the real 26.3 API. Never fails the build.
    if (project.name == 'alchemy') {
        tasks.register('probeMcApi') {
            doLast {
                try {
                    def jars = project.sourceSets.main.compileClasspath.files.findAll { it.name.endsWith('.jar') }
                    def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
                    def probes = [
                        'net.minecraft.world.inventory.BrewingStandMenu$PotionSlot'          : ['mayPlace', 'mayPlaceItem'],
                        'net.minecraft.world.inventory.BrewingStandMenu$IngredientsSlot'     : ['mayPlace'],
                        'net.minecraft.world.level.block.entity.BrewingStandBlockEntity'     : ['canPlaceItem', 'doBrew', 'isBrewable'],
                        'net.minecraft.world.item.Item'                                      : ['finishUsingItem', 'releaseUsing', 'getPlayerPOVHitResult'],
                        'net.minecraft.world.item.BucketItem'                                : ['use'],
                        'net.minecraft.world.item.EggItem'                                   : ['use'],
                        'net.minecraft.world.item.SnowballItem'                              : ['use'],
                        'net.minecraft.world.entity.LivingEntity'                            : ['addEffect'],
                        'net.minecraft.world.entity.player.Player'                           : ['addAdditionalSaveData', 'die', 'readAdditionalSaveData'],
                        'net.minecraft.world.entity.projectile.arrow.Arrow'                  : ['doPostHurtEffects'],
                        'net.minecraft.world.entity.AreaEffectCloud'                         : ['serverTick'],
                        'net.minecraft.world.item.trading.ItemCost'                          : ['test'],
                        'net.minecraft.world.entity.projectile.throwableitemprojectile.ThrownSplashPotion': ['onHitAsPotion'],
                        'net.minecraft.world.entity.monster.Witch'                           : ['performRangedAttack']
                    ]
                    println 'herbcraft-probe BEGIN 26.3 mixin target API'
                    println "herbcraft-probe compileClasspath jars=${jars.size()}"
                    probes.each { cls, methods ->
                        def entry = cls.replace('.', '/') + '.class'
                        def jar = jars.find { j -> new java.util.zip.ZipFile(j).withCloseable { it.getEntry(entry) != null } }
                        if (jar == null) {
                            println "herbcraft-probe MISSING ${cls}"
                            return
                        }
                        def proc = [javap, '-p', '-cp', jar.absolutePath, cls].execute()
                        def out = proc.inputStream.text
                        proc.waitFor()
                        println "herbcraft-probe ## ${cls} (exit ${proc.exitValue()})"
                        out.eachLine { line ->
                            if (cls.endsWith('Slot') || methods.any { m -> line.contains(m + '(') } || line.contains(' class ')) {
                                println "herbcraft-probe   ${line}"
                            }
                        }
                    }
                    println 'herbcraft-probe END'
                } catch (Throwable t) {
                    println "herbcraft-probe FAILED: ${t}"
                }
            }
        }
        tasks.named('compileJava') { dependsOn 'probeMcApi' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        withSourcesJar()
    }

    jar {
        from(rootProject.file('LICENSE')) { rename { "${it}_${project.name}" } }
    }
}
